<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VelvetNet Gym CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ============================================
   RESET & BASE
   ============================================ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --sidebar-bg:#111827;
  --sidebar-hover:#1f2937;
  --accent:#10b981;
  --accent-dark:#059669;
  --accent-light:#d1fae5;
  --text:#111827;
  --text-muted:#6b7280;
  --border:#e5e7eb;
  --bg:#f9fafb;
  --white:#ffffff;
  --danger:#ef4444;
  --warning:#f59e0b;
  --info:#3b82f6;
  --radius:10px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-lg:0 10px 25px rgba(0,0,0,.08);
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ============================================
   LAYOUT
   ============================================ */
.app{display:flex;min-height:100vh}
.sidebar{
  width:240px;background:var(--sidebar-bg);color:#fff;display:flex;
  flex-direction:column;position:fixed;height:100vh;z-index:100;
  transition:transform .25s ease;
}
.main{
  flex:1;margin-left:240px;display:flex;flex-direction:column;min-height:100vh;
}
.topbar{
  background:var(--white);border-bottom:1px solid var(--border);
  padding:14px 24px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:50;
}
.topbar h2{font-size:18px;font-weight:600}
.content{padding:24px;flex:1}

/* ============================================
   SIDEBAR
   ============================================ */
.sidebar-brand{
  padding:20px;border-bottom:1px solid rgba(255,255,255,.08);
  display:flex;align-items:center;gap:10px;
}
.sidebar-brand .logo{
  width:34px;height:34px;background:var(--accent);border-radius:8px;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;
}
.sidebar-brand span{font-weight:600;font-size:15px}
.nav{flex:1;padding:12px 8px;overflow-y:auto}
.nav-item{
  display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;
  color:#9ca3af;font-size:14px;font-weight:500;width:100%;text-align:left;
  transition:background .15s,color .15s;margin-bottom:2px;
}
.nav-item:hover{background:var(--sidebar-hover);color:#fff}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item svg{width:18px;height:18px;flex-shrink:0}
.sidebar-footer{padding:12px 8px;border-top:1px solid rgba(255,255,255,.08)}
.sidebar-footer .user{
  padding:10px 14px;color:#9ca3af;font-size:12px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

/* ============================================
   CARDS & COMPONENTS
   ============================================ */
.card{
  background:var(--white);border-radius:var(--radius);border:1px solid var(--border);
  box-shadow:var(--shadow);
}
.card-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;
  align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.card-header h3{font-size:15px;font-weight:600}
.card-body{padding:20px}

.stats-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
  gap:16px;margin-bottom:24px;
}
.stat-card{
  background:var(--white);border-radius:var(--radius);border:1px solid var(--border);
  padding:18px;box-shadow:var(--shadow);
}
.stat-card .label{font-size:12px;color:var(--text-muted);font-weight:500;
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.stat-card .value{font-size:26px;font-weight:700;color:var(--text)}
.stat-card .value.green{color:var(--accent)}
.stat-card .value.red{color:var(--danger)}
.stat-card .value.orange{color:var(--warning)}
.stat-card .value.blue{color:var(--info)}
.stat-card .sub{font-size:12px;color:var(--text-muted);margin-top:4px}

/* ============================================
   BUTTONS
   ============================================ */
.btn{
  display:inline-flex;align-items:center;gap:6px;padding:9px 16px;
  border-radius:8px;font-size:13px;font-weight:600;transition:all .15s;
  white-space:nowrap;
}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent-dark)}
.btn-secondary{background:var(--white);color:var(--text);border:1px solid var(--border)}
.btn-secondary:hover:not(:disabled){background:var(--bg)}
.btn-danger{background:var(--danger);color:#fff}
.btn-danger:hover:not(:disabled){background:#dc2626}
.btn-warning{background:var(--warning);color:#fff}
.btn-sm{padding:6px 12px;font-size:12px}
.btn-icon{padding:7px;border-radius:6px}

/* ============================================
   FORMS
   ============================================ */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-group.full{grid-column:1/-1}
.form-group label{font-size:13px;font-weight:600;color:var(--text)}
.form-group input,.form-group select,.form-group textarea{
  padding:10px 12px;border:1px solid var(--border);border-radius:8px;
  background:var(--white);transition:border .15s,box-shadow .15s;
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(16,185,129,.1);
}
.form-group textarea{resize:vertical;min-height:70px}
.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;
  padding-top:20px;border-top:1px solid var(--border)}

/* ============================================
   TABLES
   ============================================ */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px}
th{
  text-align:left;padding:11px 14px;font-weight:600;color:var(--text-muted);
  font-size:11px;text-transform:uppercase;letter-spacing:.5px;
  border-bottom:1px solid var(--border);background:var(--bg);white-space:nowrap;
}
td{padding:12px 14px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:hover{background:#fafafa}
tbody tr:last-child td{border-bottom:none}

.badge{
  display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;
  font-weight:600;white-space:nowrap;
}
.badge-active{background:var(--accent-light);color:#065f46}
.badge-expired{background:#fee2e2;color:#991b1b}
.badge-soon{background:#fef3c7;color:#92400e}
.badge-info{background:#dbeafe;color:#1e40af}
.badge-gray{background:#f3f4f6;color:#4b5563}

/* ============================================
   TOOLBAR
   ============================================ */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.search-box{position:relative;flex:1;min-width:200px;max-width:380px}
.search-box input{width:100%;padding:10px 12px 10px 36px;border:1px solid var(--border);
  border-radius:8px;background:var(--white)}
.search-box input:focus{outline:none;border-color:var(--accent)}
.search-box svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:16px;height:16px;color:var(--text-muted)}
.filter-tabs{display:flex;gap:4px;background:var(--white);border:1px solid var(--border);
  border-radius:8px;padding:3px}
.filter-tabs button{padding:7px 13px;border-radius:6px;font-size:12px;font-weight:600;
  color:var(--text-muted)}
.filter-tabs button.active{background:var(--accent);color:#fff}

/* ============================================
   MODAL
   ============================================ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:1000;
  display:none;align-items:flex-start;justify-content:center;padding:40px 16px;
  overflow-y:auto;
}
.modal-overlay.show{display:flex}
.modal{
  background:var(--white);border-radius:var(--radius);width:100%;max-width:640px;
  box-shadow:var(--shadow-lg);margin:auto 0;
}
.modal.wide{max-width:800px}
.modal-header{padding:18px 22px;border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between}
.modal-header h3{font-size:16px;font-weight:600}
.modal-close{font-size:22px;color:var(--text-muted);width:30px;height:30px;
  border-radius:6px;display:flex;align-items:center;justify-content:center}
.modal-close:hover{background:var(--bg)}
.modal-body{padding:22px;max-height:70vh;overflow-y:auto}
.modal-footer{padding:16px 22px;border-top:1px solid var(--border);
  display:flex;gap:10px;justify-content:flex-end}

/* ============================================
   TOAST
   ============================================ */
.toast-container{position:fixed;top:20px;right:20px;z-index:2000;
  display:flex;flex-direction:column;gap:10px}
.toast{
  padding:13px 18px;border-radius:8px;color:#fff;font-size:13px;font-weight:500;
  box-shadow:var(--shadow-lg);animation:slideIn .25s ease;min-width:260px;
  display:flex;align-items:center;gap:10px;
}
.toast.success{background:var(--accent)}
.toast.error{background:var(--danger)}
.toast.info{background:var(--info)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* ============================================
   LOGIN
   ============================================ */
.login-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#111827 0%,#1f2937 100%);padding:20px;
}
.login-card{
  background:var(--white);border-radius:14px;padding:40px 36px;width:100%;
  max-width:400px;box-shadow:var(--shadow-lg);
}
.login-card .brand{text-align:center;margin-bottom:28px}
.login-card .brand .logo{
  width:56px;height:56px;background:var(--accent);border-radius:14px;
  display:inline-flex;align-items:center;justify-content:center;
  color:#fff;font-size:26px;font-weight:700;margin-bottom:12px;
}
.login-card .brand h1{font-size:22px;font-weight:700}
.login-card .brand p{color:var(--text-muted);font-size:13px;margin-top:4px}

/* ============================================
   MISC
   ============================================ */
.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted)}
.empty-state svg{width:48px;height:48px;margin-bottom:12px;opacity:.4}
.spinner{
  width:16px;height:16px;border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay{
  display:flex;align-items:center;justify-content:center;padding:50px;
  color:var(--text-muted);gap:10px;
}
.actions-cell{display:flex;gap:4px}
.section-title{font-size:14px;font-weight:600;margin:20px 0 10px;
  padding-bottom:8px;border-bottom:1px solid var(--border)}
.section-title:first-child{margin-top:0}
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.info-item .lbl{font-size:11px;color:var(--text-muted);text-transform:uppercase;
  letter-spacing:.4px;font-weight:600;margin-bottom:3px}
.info-item .val{font-size:14px;font-weight:500}

.mobile-menu-btn{display:none;background:none;padding:6px;border-radius:6px}
.mobile-menu-btn svg{width:22px;height:22px}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99}

/* ============================================
   RECEIPT
   ============================================ */
.receipt{max-width:360px;margin:0 auto;font-family:'Courier New',monospace;
  padding:20px;background:#fff}
.receipt h2{text-align:center;font-size:18px;margin-bottom:4px}
.receipt .center{text-align:center;font-size:12px;color:#555;margin-bottom:14px}
.receipt hr{border:none;border-top:1px dashed #999;margin:12px 0}
.receipt-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
.receipt-row.total{font-weight:700;font-size:15px;border-top:1px solid #333;
  padding-top:8px;margin-top:8px}
.receipt .thanks{text-align:center;margin-top:18px;font-size:12px;color:#555}

/* ============================================
   RESPONSIVE
   ============================================ */
@media(max-width:900px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-backdrop.show{display:block}
  .main{margin-left:0}
  .mobile-menu-btn{display:block}
  .form-grid{grid-template-columns:1fr}
  .info-grid{grid-template-columns:1fr}
  .content{padding:16px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:12px}
  .stat-card .value{font-size:22px}
}
@media(max-width:520px){
  .stats-grid{grid-template-columns:1fr}
  .toolbar{flex-direction:column;align-items:stretch}
  .search-box{max-width:none}
  .modal-body{padding:16px}
  .modal-header,.modal-footer{padding:14px 16px}
  .topbar{padding:12px 16px}
  .topbar h2{font-size:16px}
}

@media print{
  body *{visibility:hidden}
  .receipt,.receipt *{visibility:visible}
  .receipt{position:absolute;left:0;top:0;width:100%}
}
</style>
</head>

const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhkZWJ4aHN0bGFoZGl6c2RqY3lyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAwOTM1ODIsImV4cCI6MjEwNTY2OTU4Mn0.OVRm-q0Xk7WCIUXf6y04j5rXAZgRkkDnXQkp4_2AOY0';

/* ============================================================
   SUPABASE CLIENT  (js/supabase.js)
   ============================================================ */
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ============================================================
   GLOBAL STATE / CACHE
   ============================================================ */
const state = {
  user: null,
  gym: null,
  settings: null,
  packages: [],
  currentPage: 'dashboard',
  membersCache: {},     // id -> member object
  membersList: [],
  pendingEditMember: null,
};

const CURRENCY = () => state.settings?.currency || '₹';
const WARNING_DAYS = () => state.settings?.warning_days || 7;

/* ============================================================
   UTILITIES
   ============================================================ */
function $(sel, root = document) { return root.querySelector(sel); }
function $$(sel, root = document) { return [...root.querySelectorAll(sel)]; }

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function formatDate(d) {
  if (!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if (isNaN(dt)) return d;
  return dt.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });
}

function formatTime(t) {
  if (!t) return '—';
  const [h, m] = t.split(':');
  const hr = parseInt(h);
  const ampm = hr >= 12 ? 'PM' : 'AM';
  const h12 = hr % 12 || 12;
  return `${h12}:${m} ${ampm}`;
}

function todayISO() {
  return new Date().toISOString().split('T')[0];
}

function daysBetween(a, b) {
  const d1 = new Date(a + 'T00:00:00');
  const d2 = new Date(b + 'T00:00:00');
  return Math.round((d2 - d1) / 86400000);
}

function money(n) {
  const num = Number(n) || 0;
  return CURRENCY() + num.toLocaleString('en-IN', { maximumFractionDigits: 2 });
}

/** Compute membership status for a member */
function memberStatus(member) {
  if (!member || !member.end_date) return 'no-membership';
  const today = todayISO();
  const remaining = daysBetween(today, member.end_date);
  if (remaining < 0) return 'expired';
  if (remaining <= WARNING_DAYS()) return 'expiring-soon';
  return 'active';
}

function statusBadge(status) {
  const map = {
    'active': ['Active', 'badge-active'],
    'expired': ['Expired', 'badge-expired'],
    'expiring-soon': ['Expiring Soon', 'badge-soon'],
    'no-membership': ['No Membership', 'badge-gray'],
  };
  const [label, cls] = map[status] || ['Unknown', 'badge-gray'];
  return `<span class="badge ${cls}">${label}</span>`;
}

function getPending(member) {
  return (Number(member.amount) || 0) - (Number(member.paid) || 0);
}

function friendlyError(err) {
  const msg = (err?.message || '').toLowerCase();
  if (msg.includes('invalid login')) return 'Invalid email or password';
  if (msg.includes('email not confirmed')) return 'Please confirm your email first';
  if (msg.includes('duplicate') && msg.includes('member_id')) return 'Member ID already exists';
  if (msg.includes('duplicate') && msg.includes('attendance')) return 'Attendance already recorded today';
  if (msg.includes('permission') || msg.includes('policy')) return 'You do not have permission for this action';
  if (msg.includes('network') || msg.includes('fetch')) return 'Network error. Check your connection.';
  return err?.message || 'Something went wrong';
}

const api = {
  /* -------- GYM -------- */
  async ensureGym() {
    const { data: existing } = await sb.from('gyms').select('*').limit(1).maybeSingle();
    if (existing) return existing;
    const { data, error } = await sb.from('gyms')
      .insert({ name: 'My Gym', owner_id: state.user.id })
      .select().single();
    if (error) throw error;
    return data;
  },

  /* -------- SETTINGS -------- */
  async getSettings(gymId) {
    const { data } = await sb.from('gym_settings').select('*').eq('gym_id', gymId).maybeSingle();
    if (data) return data;
    const { data: created, error } = await sb.from('gym_settings')
      .insert({ gym_id: gymId, gym_name: 'My Gym' })
      .select().single();
    if (error) throw error;
    return created;
  },
  async updateSettings(id, patch) {
    const { data, error } = await sb.from('gym_settings')
      .update(patch).eq('id', id).select().single();
    if (error) throw error;
    return data;
  },

  /* -------- PACKAGES -------- */
  async getPackages(gymId) {
    const { data, error } = await sb.from('packages')
      .select('id,name,duration_months,price,description,status')
      .eq('gym_id', gymId).eq('status', 'active')
      .order('duration_months');
    if (error) throw error;
    return data || [];
  },
  async createPackage(gymId, p) {
    const { data, error } = await sb.from('packages')
      .insert({ ...p, gym_id: gymId }).select().single();
    if (error) throw error;
    return data;
  },
  async updatePackage(id, patch) {
    const { data, error } = await sb.from('packages')
      .update(patch).eq('id', id).select().single();
    if (error) throw error;
    return data;
  },
  async deletePackage(id) {
    const { error } = await sb.from('packages').update({ status: 'inactive' }).eq('id', id);
    if (error) throw error;
  },

  /* -------- MEMBERS -------- */
  async getMembers(gymId, { search = '', filter = 'all', limit = 500 } = {}) {
    let q = sb.from('members')
      .select('id,member_id,name,phone,email,gender,package_id,start_date,end_date,amount,paid,joining_date')
      .eq('gym_id', gymId)
      .order('created_at', { ascending: false })
      .limit(limit);
    if (search) {
      q = q.or(`name.ilike.%${search}%,phone.ilike.%${search}%,member_id.ilike.%${search}%`);
    }
    const { data, error } = await q;
    if (error) throw error;
    let list = data || [];
    if (filter === 'active') list = list.filter(m => memberStatus(m) === 'active');
    else if (filter === 'expired') list = list.filter(m => memberStatus(m) === 'expired');
    else if (filter === 'expiring-soon') list = list.filter(m => memberStatus(m) === 'expiring-soon');
    return list;
  },
  async getMember(id) {
    const { data, error } = await sb.from('members').select('*').eq('id', id).single();
    if (error) throw error;
    return data;
  },
  async createMember(gymId, m) {
    const { data, error } = await sb.from('members')
      .insert({ ...m, gym_id: gymId }).select().single();
    if (error) throw error;
    return data;
  },
  async updateMember(id, patch) {
    const { data, error } = await sb.from('members')
      .update(patch).eq('id', id).select().single();
    if (error) throw error;
    return data;
  },
  async deleteMember(id) {
    const { error } = await sb.from('members').delete().eq('id', id);
    if (error) throw error;
  },
  async nextMemberId(gymId) {
    const { data } = await sb.from('members')
      .select('member_id').eq('gym_id', gymId)
      .order('created_at', { ascending: false }).limit(1);
    let next = 1;
    if (data?.[0]?.member_id) {
      const n = parseInt(data[0].member_id.replace(/\D/g, ''), 10);
      if (!isNaN(n)) next = n + 1;
    }
    return 'M' + String(next).padStart(4, '0');
  },

  /* -------- ATTENDANCE -------- */
  async getAttendance(gymId, { date = null, memberId = null, limit = 200 } = {}) {
    let q = sb.from('attendance')
      .select('id,member_id,date,check_in,check_out,members(name,member_id,phone)')
      .eq('gym_id', gymId)
      .order('date', { ascending: false })
      .order('check_in', { ascending: false })
      .limit(limit);
    if (date) q = q.eq('date', date);
    if (memberId) q = q.eq('member_id', memberId);
    const { data, error } = await q;
    if (error) throw error;
    return data || [];
  },
  async getTodayAttendanceForMember(gymId, memberId) {
    const { data } = await sb.from('attendance')
      .select('*').eq('gym_id', gymId).eq('member_id', memberId)
      .eq('date', todayISO()).maybeSingle();
    return data;
  },
  async markAttendance(gymId, memberId) {
    const now = new Date();
    const time = now.toTimeString().split(' ')[0];
    const { data, error } = await sb.from('attendance')
      .insert({ gym_id: gymId, member_id: memberId, date: todayISO(), check_in: time })
      .select().single();
    if (error) {
      if (error.code === '23505') throw new Error('Attendance already recorded today');
      throw error;
    }
    return data;
  },
  async checkoutAttendance(id) {
    const time = new Date().toTimeString().split(' ')[0];
    const { data, error } = await sb.from('attendance')
      .update({ check_out: time }).eq('id', id).select().single();
    if (error) throw error;
    return data;
  },
  async countTodayAttendance(gymId) {
    const { count } = await sb.from('attendance')
      .select('id', { count: 'exact', head: true })
      .eq('gym_id', gymId).eq('date', todayISO());
    return count || 0;
  },

  /* -------- PAYMENTS -------- */
  async getPayments(gymId, { memberId = null, from = null, to = null, search = '', limit = 200 } = {}) {
    let q = sb.from('payments')
      .select('id,member_id,date,amount,method,package,transaction_id,notes,members(name,member_id,phone)')
      .eq('gym_id', gymId)
      .order('date', { ascending: false })
      .order('created_at', { ascending: false })
      .limit(limit);
    if (memberId) q = q.eq('member_id', memberId);
    if (from) q = q.gte('date', from);
    if (to) q = q.lte('date', to);
    const { data, error } = await q;
    if (error) throw error;
    let list = data || [];
    if (search) {
      const s = search.toLowerCase();
      list = list.filter(p =>
        p.members?.name?.toLowerCase().includes(s) ||
        p.members?.member_id?.toLowerCase().includes(s) ||
        p.members?.phone?.includes(s) ||
        p.transaction_id?.toLowerCase().includes(s)
      );
    }
    return list;
  },
  async createPayment(gymId, p) {
    const { data, error } = await sb.from('payments')
      .insert({ ...p, gym_id: gymId }).select().single();
    if (error) throw error;
    // Update member paid amount
    const member = await api.getMember(p.member_id);
    const newPaid = (Number(member.paid) || 0) + Number(p.amount);
    await api.updateMember(member.id, { paid: newPaid });
    return data;
  },
  async updatePayment(id, patch) {
    const before = (await sb.from('payments').select('*').eq('id', id).single()).data;
    const { data, error } = await sb.from('payments')
      .update(patch).eq('id', id).select().single();
    if (error) throw error;
    // Adjust member paid
    if (before && patch.amount !== undefined && Number(patch.amount) !== Number(before.amount)) {
      const diff = Number(patch.amount) - Number(before.amount);
      const member = await api.getMember(before.member_id);
      await api.updateMember(member.id, { paid: (Number(member.paid) || 0) + diff });
    }
    return data;
  },
  async deletePayment(id) {
    const before = (await sb.from('payments').select('*').eq('id', id).single()).data;
    const { error } = await sb.from('payments').delete().eq('id', id);
    if (error) throw error;
    if (before) {
      const member = await api.getMember(before.member_id);
      await api.updateMember(member.id, {
        paid: Math.max(0, (Number(member.paid) || 0) - Number(before.amount))
      });
    }
  },

  /* -------- DASHBOARD -------- */
  async getDashboardStats(gymId) {
    const today = todayISO();
    const now = new Date();
    const monthStart = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
    const monthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];

    // We need enough member data to compute status. Pull minimum columns.
    const { data: members } = await sb.from('members')
      .select('id,end_date,amount,paid').eq('gym_id', gymId).limit(5000);

    const list = members || [];
    let active = 0, expired = 0, expiring = 0, totalPending = 0;
    for (const m of list) {
      const s = memberStatus(m);
      if (s === 'active') active++;
      else if (s === 'expired') expired++;
      else if (s === 'expiring-soon') expiring++;
      totalPending += Math.max(0, getPending(m));
    }

    // Revenue (today & this month)
    const { data: todayPays } = await sb.from('payments')
      .select('amount').eq('gym_id', gymId).eq('date', today);
    const todayRevenue = (todayPays || []).reduce((s, p) => s + Number(p.amount), 0);

    const { data: monthPays } = await sb.from('payments')
      .select('amount').eq('gym_id', gymId).gte('date', monthStart).lte('date', monthEnd);
    const monthRevenue = (monthPays || []).reduce((s, p) => s + Number(p.amount), 0);

    const todayAttendance = await api.countTodayAttendance(gymId);

    return {
      totalMembers: list.length,
      active, expired, expiring,
      todayAttendance,
      todayRevenue,
      monthRevenue,
      pendingPayments: totalPending,
    };
  },

  async getExpiryBuckets(gymId) {
    const { data: members } = await sb.from('members')
      .select('id,member_id,name,phone,end_date,amount,paid,packages(name)')
      .eq('gym_id', gymId).limit(5000);
    const today = todayISO();
    const buckets = { expired: [], d7: [], d15: [], d30: [] };
    for (const m of members || []) {
      if (!m.end_date) continue;
      const rem = daysBetween(today, m.end_date);
      if (rem < 0) buckets.expired.push(m);
      else if (rem <= 7) buckets.d7.push(m);
      else if (rem <= 15) buckets.d15.push(m);
      else if (rem <= 30) buckets.d30.push(m);
    }
    return buckets;
  },

  /* -------- REPORTS -------- */
  async getReport(gymId, from, to) {
    const { data: newMembers } = await sb.from('members')
      .select('id,joining_date').eq('gym_id', gymId)
      .gte('joining_date', from).lte('joining_date', to);

    const { data: pays } = await sb.from('payments')
      .select('amount,date,method').eq('gym_id', gymId)
      .gte('date', from).lte('date', to);

    const { count: attendance } = await sb.from('attendance')
      .select('id', { count: 'exact', head: true })
      .eq('gym_id', gymId).gte('date', from).lte('date', to);

    const { data: allMembers } = await sb.from('members')
      .select('id,end_date,amount,paid').eq('gym_id', gymId);

    let active = 0, expired = 0, pending = 0;
    (allMembers || []).forEach(m => {
      const s = memberStatus(m);
      if (s === 'active' || s === 'expiring-soon') active++;
      else if (s === 'expired') expired++;
      pending += Math.max(0, getPending(m));
    });

    const revenue = (pays || []).reduce((s, p) => s + Number(p.amount), 0);
    const byMethod = {};
    (pays || []).forEach(p => {
      byMethod[p.method] = (byMethod[p.method] || 0) + Number(p.amount);
    });

    return {
      newMembers: newMembers?.length || 0,
      revenue,
      byMethod,
      attendance: attendance || 0,
      totalMembers: allMembers?.length || 0,
      activeMembers: active,
      expiredMembers: expired,
      pendingPayments: pending,
    };
  },
};

async function bootApp() {
  try {
    showApp();
    setPageTitle('Loading...');
    state.gym = await api.ensureGym();
    // Load settings + packages in parallel
    const [settings, packages] = await Promise.all([
      api.getSettings(state.gym.id),
      api.getPackages(state.gym.id),
    ]);
    state.settings = settings;
    state.packages = packages;
    document.title = `${settings.gym_name} — VelvetNet CRM`;
    navigate('dashboard');
  } catch (err) {
    console.error(err);
    toast(friendlyError(err), 'error');
    setPageTitle('Error');
  }
}

    membersUI.filter = b.dataset.f;
    $$('#memberFilters button').forEach(x => x.classList.toggle('active', x === b));
    loadMembersTable();
  }));

  loadMembersTable();
}

async function loadMembersTable() {
  const wrap = $('#membersTable');
  if (!wrap) return;
  wrap.innerHTML = '<div class="loading-overlay"><span class="spinner" style="border-color:var(--border);border-top-color:var(--accent)"></span> Loading...</div>';
  try {
    const members = await api.getMembers(state.gym.id, {
      search: membersUI.search,
      filter: membersUI.filter,
    });
    state.membersList = members;
    state.membersCache = {};
    members.forEach(m => state.membersCache[m.id] = m);

    if (members.length === 0) {
      wrap.innerHTML = '<div class="empty-state">No members found</div>';
      return;
    }

    const pkgMap = {};
    state.packages.forEach(p => pkgMap[p.id] = p.name);

    wrap.innerHTML = `
      <div class="table-wrap"><table>
        <thead><tr>
          <th>ID</th><th>Name</th><th>Phone</th><th>Package</th>
          <th>Start</th><th>End</th><th>Amount</th><th>Paid</th><th>Pending</th>
          <th>Status</th><th>Actions</th>
        </tr></thead>
        <tbody>
          ${members.map(m => {
            const status = memberStatus(m);
            const pending = Math.max(0, getPending(m));
            return `<tr>
              <td>${escapeHtml(m.member_id || '—')}</td>
              <td><strong>${escapeHtml(m.name)}</strong></td>
              <td>${escapeHtml(m.phone || '—')}</td>
              <td>${escapeHtml(pkgMap[m.package_id] || '—')}</td>
              <td>${formatDate(m.start_date)}</td>
              <td>${formatDate(m.end_date)}</td>
              <td>${money(m.amount)}</td>
              <td>${money(m.paid)}</td>
              <td style="color:${pending>0?'var(--danger)':'inherit'};font-weight:${pending>0?'600':'400'}">${money(pending)}</td>
              <td>${statusBadge(status)}</td>
              <td class="actions-cell">
                <button class="btn btn-secondary btn-sm" onclick="openMemberProfile('${m.id}')">View</button>
                <button class="btn btn-secondary btn-sm" onclick="openRenewModal('${m.id}')">Renew</button>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>
    `;
  } catch (err) {
    console.error(err);
    wrap.innerHTML = `<div class="empty-state">Failed to load members</div>`;
    toast(friendlyError(err), 'error');
  }
}

function openMemberForm(member, presetMemberId) {
  const isEdit = !!member;
  const m = member || {
    member_id: presetMemberId, name: '', phone: '', email: '', gender: '',
    dob: '', address: '', joining_date: todayISO(),
    package_id: '', start_date: todayISO(), end_date: '',
    amount: 0, paid: 0, emergency_contact: '', notes: '',
  };
  const pkgOptions = state.packages.map(p =>
    `<option value="${p.id}" data-dur="${p.duration_months}" data-price="${p.price}"
      ${m.package_id === p.id ? 'selected' : ''}>${escapeHtml(p.name)} — ${money(p.price)} / ${p.duration_months} mo</option>`
  ).join('');

  openModal({
    title: isEdit ? 'Edit Member' : 'Add Member',
    wide: true,
    body: `
      <form id="memberForm" class="form-grid">
        <div class="form-group"><label>Member ID</label>
          <input name="member_id" value="${escapeHtml(m.member_id || '')}" readonly style="background:#f9fafb"></div>
        <div class="form-group"><label>Name *</label>
          <input name="name" required value="${escapeHtml(m.name || '')}"></div>
        <div class="form-group"><label>Phone</label>
          <input name="phone" value="${escapeHtml(m.phone || '')}"></div>
        <div class="form-group"><label>Email</label>
          <input name="email" type="email" value="${escapeHtml(m.email || '')}"></div>
        <div class="form-group"><label>Gender</label>
          <select name="gender">
            <option value="">—</option>
            <option value="Male" ${m.gender==='Male'?'selected':''}>Male</option>
            <option value="Female" ${m.gender==='Female'?'selected':''}>Female</option>
            <option value="Other" ${m.gender==='Other'?'selected':''}>Other</option>
          </select></div>
        <div class="form-group"><label>Date of Birth</label>
          <input name="dob" type="date" value="${m.dob || ''}"></div>
        <div class="form-group full"><label>Address</label>
          <textarea name="address">${escapeHtml(m.address || '')}</textarea></div>
        <div class="form-group"><label>Emergency Contact</label>
          <input name="emergency_contact" value="${escapeHtml(m.emergency_contact || '')}"></div>
        <div class="form-group"><label>Joining Date</label>
          <input name="joining_date" type="date" value="${m.joining_date || todayISO()}"></div>

        <div class="form-group full" style="margin-top:6px"><label style="font-size:14px;color:var(--accent)">Membership</label></div>
        <div class="form-group"><label>Package</label>
          <select name="package_id" id="pkgSelect">
            <option value="">— No package —</option>
            ${pkgOptions}
          </select></div>
        <div class="form-group"><label>Start Date</label>
          <input name="start_date" id="startDate" type="date" value="${m.start_date || todayISO()}"></div>
        <div class="form-group"><label>End Date</label>
          <input name="end_date" id="endDate" type="date" value="${m.end_date || ''}"></div>
        <div class="form-group"><label>Amount</label>
          <input name="amount" id="amountInput" type="number" step="0.01" value="${m.amount || 0}"></div>
        <div class="form-group"><label>Paid</label>
          <input name="paid" type="number" step="0.01" value="${m.paid || 0}"></div>
        <div class="form-group full"><label>Notes</label>
          <textarea name="notes">${escapeHtml(m.notes || '')}</textarea></div>
      </form>
    `,
    footer: `
      ${isEdit ? `<button class="btn btn-danger" id="deleteMemberBtn">Delete</button>` : ''}
      <button class="btn btn-secondary" id="cancelMemberBtn">Cancel</button>
      <button class="btn btn-primary" id="saveMemberBtn">${isEdit ? 'Save Changes' : 'Add Member'}</button>
    `
  });

  // Auto-calc end date & amount
  const pkgSelect = $('#pkgSelect');
  const startDate = $('#startDate');
  const endDate = $('#endDate');
  const amountInput = $('#amountInput');

  function recalc() {
    const opt = pkgSelect.selectedOptions[0];
    if (!opt || !opt.value) return;
    const dur = parseInt(opt.dataset.dur, 10);
    const price = parseFloat(opt.dataset.price);
    if (!startDate.value) startDate.value = todayISO();
    if (!endDate.value || !isEdit) {
      const end = new Date(startDate.value + 'T00:00:00');
      end.setMonth(end.getMonth() + dur);
      endDate.value = end.toISOString().split('T')[0];
    }
    if (!amountInput.value || parseFloat(amountInput.value) === 0) amountInput.value = price;
  }
  pkgSelect.addEventListener('change', () => { endDate.value = ''; recalc(); });
  startDate.addEventListener('change', () => { endDate.value = ''; recalc(); });

  $('#cancelMemberBtn').addEventListener('click', closeModal);

  if (isEdit) {
    $('#deleteMemberBtn').addEventListener('click', async () => {
      if (!confirm('Delete this member? This will also delete their payments and attendance.')) return;
      try {
        await api.deleteMember(member.id);
        toast('Member deleted');
        closeModal();
        loadMembersTable();
      } catch (err) { toast(friendlyError(err), 'error'); }
    });
  }

  $('#saveMemberBtn').addEventListener('click', async () => {
    const btn = $('#saveMemberBtn');
    const data = {};
    new FormData($('#memberForm')).forEach((v, k) => {
      data[k] = v === '' ? null : v;
    });
    if (!data.name) return toast('Name is required', 'error');
    ['amount','paid'].forEach(k => data[k] = parseFloat(data[k]) || 0);
    ['dob','joining_date','start_date','end_date'].forEach(k => {
      if (!data[k]) delete data[k];
    });
    if (!data.package_id) data.package_id = null;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Saving...';
    try {
      if (isEdit) {
        await api.updateMember(member.id, data);
        toast('Member updated');
      } else {
        await api.createMember(state.gym.id, data);
        toast('Member added');
      }
      closeModal();
      loadMembersTable();
    } catch (err) {
      console.error(err);
      toast(friendlyError(err), 'error');
      btn.disabled = false;
      btn.textContent = isEdit ? 'Save Changes' : 'Add Member';
    }
  });
}

async function openMarkAttendanceModal() {
  // Load members for select
  let members = state.membersList;
  if (!members.length) {
    members = await api.getMembers(state.gym.id, { limit: 1000 });
  }
  const activeMembers = members.filter(m => {
    const s = memberStatus(m);
    return s === 'active' || s === 'expiring-soon';
  });

  openModal({
    title: 'Mark Attendance',
    body: `
      <div class="form-group">
        <label>Search Member</label>
        <input type="text" id="attModalSearch" placeholder="Type name or phone...">
      </div>
      <div id="attModalList" style="max-height:340px;overflow-y:auto;margin-top:14px;border:1px solid var(--border);border-radius:8px">
        ${activeMembers.map(m => `
          <div class="att-pick" data-id="${m.id}" style="padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center">
            <div><strong>${escapeHtml(m.name)}</strong><br><span style="font-size:12px;color:var(--text-muted)">${escapeHtml(m.member_id||'')} · ${escapeHtml(m.phone||'')}</span></div>
            <button class="btn btn-primary btn-sm">Check In</button>
          </div>
        `).join('')}
      </div>
    `,
    footer: `<button class="btn btn-secondary" onclick="closeModal()">Close</button>`
  });

  const list = $('#attModalList');
  const search = $('#attModalSearch');
  function renderList(filter = '') {
    const f = filter.toLowerCase();
    const filtered = activeMembers.filter(m =>
      !f || m.name.toLowerCase().includes(f) || (m.phone||'').includes(f) || (m.member_id||'').toLowerCase().includes(f)
    );
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-state" style="padding:20px">No matching active members</div>';
      return;
    }
    list.innerHTML = filtered.map(m => `
      <div class="att-pick" data-id="${m.id}" style="padding:11px 14px;border-bottom:1px solid var(--border);cursor:pointer;display:flex;justify-content:space-between;align-items:center">
        <div><strong>${escapeHtml(m.name)}</strong><br><span style="font-size:12px;color:var(--text-muted)">${escapeHtml(m.member_id||'')} · ${escapeHtml(m.phone||'')}</span></div>
        <button class="btn btn-primary btn-sm">Check In</button>
      </div>
    `).join('');
    bindPick();
  }
  function bindPick() {
    $$('.att-pick').forEach(el => {
      el.addEventListener('click', async () => {
        const id = el.dataset.id;
        try {
          const existing = await api.getTodayAttendanceForMember(state.gym.id, id);
          if (existing) {
            if (!existing.check_out) {
              if (confirm('Already checked in. Check out now?')) {
                await api.checkoutAttendance(existing.id);
                toast('Checked out');
                closeModal();
                if (state.currentPage === 'attendance') loadAttendanceTable();
              }
            } else {
              toast('Attendance already completed today', 'info');
            }
            return;
          }
          await api.markAttendance(state.gym.id, id);
          toast('Attendance marked');
          closeModal();
          if (state.currentPage === 'attendance') loadAttendanceTable();
        } catch (err) {
          toast(friendlyError(err), 'error');
        }
      });
    });
  }
  search.addEventListener('input', () => renderList(search.value));
  bindPick();
}

async function renderPayments() {

async function loadPaymentsTable() {
  const wrap = $('#paymentsTable');
  if (!wrap) return;
  wrap.innerHTML = '<div class="loading-overlay"><span class="spinner" style="border-color:var(--border);border-top-color:var(--accent)"></span> Loading...</div>';
  try {
    const list = await api.getPayments(state.gym.id, {
      from: paymentsUI.from || null,
      to: paymentsUI.to || null,
      search: paymentsUI.search,
      limit: 300,
    });
    const total = list.reduce((s, p) => s + Number(p.amount), 0);
    const cash = list.filter(p => p.method === 'Cash').reduce((s,p)=>s+Number(p.amount),0);
    const online = total - cash;
    $('#payStats').innerHTML = `
      <div class="stat-card"><div class="label">Total Received</div><div class="value green">${money(total)}</div><div class="sub">${list.length} payment${list.length===1?'':'s'}</div></div>
      <div class="stat-card"><div class="label">Cash</div><div class="value">${money(cash)}</div></div>
      <div class="stat-card"><div class="label">Online / Card / UPI</div><div class="value blue">${money(online)}</div></div>
    `;

    if (list.length === 0) {

let reportsUI = { range: 'month', from: '', to: '' };

async function renderReports() {
  const now = new Date();
  const fmt = d => d.toISOString().split('T')[0];
  const monthStart = fmt(new Date(now.getFullYear(), now.getMonth(), 1));
  const today = fmt(now);

  $('#pageContent').innerHTML = `
    <div class="toolbar">
      <div class="filter-tabs" id="reportFilters">
        <button data-r="today">Today</button>
        <button data-r="week">This Week</button>
        <button data-r="month" class="active">This Month</button>
        <button data-r="custom">Custom</button>
      </div>
      <input type="date" id="repFrom" value="${monthStart}" style="padding:10px 12px;border:1px solid var(--border);border-radius:8px">
      <input type="date" id="repTo" value="${today}" style="padding:10px 12px;border:1px solid var(--border);border-radius:8px">
      <button class="btn btn-secondary" id="repApply">Apply</button>
    </div>
    <div id="reportBody"><div class="loading-overlay"><span class="spinner" style="border-color:var(--border);border-top-color:var(--accent)"></span> Loading...</div></div>
  `;

  $('#reportFilters button').forEach(b => b.addEventListener('click', () => {
    reportsUI.range = b.dataset.r;
    $$('#reportFilters button').forEach(x => x.classList.toggle('active', x === b));
    const today = fmt(new Date());
    if (b.dataset.r === 'today') { $('#repFrom').value = today; $('#repTo').value = today; }
    else if (b.dataset.r === 'week') {
      const wk = new Date(); wk.setDate(wk.getDate() - 7);
      $('#repFrom').value = fmt(wk); $('#repTo').value = today;
    } else if (b.dataset.r === 'month') {
      $('#repFrom').value = monthStart; $('#repTo').value = today;
    }
    loadReport();
  }));
  $('#repApply').addEventListener('click', loadReport);
  loadReport();
}

/* ============================================================
   RENEW MEMBERSHIP
   ============================================================ */
async function openRenewModal(memberId) {
  const member = await api.getMember(memberId);
  const currentPkg = state.packages.find(p => p.id === member.package_id);
  const pkgOptions = state.packages.map(p =>
    `<option value="${p.id}" data-dur="${p.duration_months}" data-price="${p.price}"
      ${member.package_id === p.id ? 'selected' : ''}>${escapeHtml(p.name)} — ${money(p.price)} / ${p.duration_months} mo</option>`
  ).join('');

  openModal({
    title: `Renew — ${member.name}`,
    wide: true,
    body: `
      <div class="info-grid" style="margin-bottom:20px">
        <div class="info-item"><div class="lbl">Current Package</div><div class="val">${escapeHtml(currentPkg?.name||'—')}</div></div>
        <div class="info-item"><div class="lbl">Current Expiry</div><div class="val">${formatDate(member.end_date)}</div></div>
      </div>
      <form id="renewForm" class="form-grid">
        <div class="form-group"><label>New Package *</label>
          <select name="package_id" id="renewPkgSelect" required>${pkgOptions}</select></div>
        <div class="form-group"><label>New Start Date *</label>
          <input name="start_date" id="renewStart" type="date" required
            value="${member.end_date && member.end_date >= todayISO() ? member.end_date : todayISO()}"></div>
        <div class="form-group"><label>New End Date</label>
          <input name="end_date" id="renewEnd" type="date" readonly></div>
        <div class="form-group"><label>Price</label>
          <input name="amount" id="renewAmount" type="number" step="0.01"></div>
        <div class="form-group"><label>Payment Amount</label>
          <input name="payment_amount" id="renewPayment" type="number" step="0.01" value="0"></div>
        <div class="form-group"><label>Payment Method</label>
          <select name="payment_method">
            <option>Cash</option><option>UPI</option><option>Card</option><option>Bank Transfer</option>
          </select></div>
        <div class="form-group full" style="background:var(--bg);padding:12px;border-radius:8px">
          <div class="lbl" style="font-size:11px;color:var(--text-muted);text-transform:uppercase;font-weight:600">New Pending Amount</div>
          <div id="renewPendingDisplay" style="font-size:20px;font-weight:700;color:var(--danger);margin-top:4px">${money(0)}</div>
        </div>
      </form>
    `,
    footer: `
      <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" id="renewSubmitBtn">Renew Membership</button>
    `
  });

  const pkgSel = $('#renewPkgSelect'), startInp = $('#renewStart'), endInp = $('#renewEnd'),
        amtInp = $('#renewAmount'), payInp = $('#renewPayment'), pendDisplay = $('#renewPendingDisplay');

  function recalc() {
    const opt = pkgSel.selectedOptions[0];
    if (!opt) return;
    const dur = parseInt(opt.dataset.dur);
    const price = parseFloat(opt.dataset.price);
    amtInp.value = price;
    const end = new Date(startInp.value + 'T00:00:00');
    end.setMonth(end.getMonth() + dur);
    endInp.value = end.toISOString().split('T')[0];
    updatePending();
  }
  function updatePending() {
    const amt = parseFloat(amtInp.value) || 0;
    const paid = parseFloat(payInp.value) || 0;
    pendDisplay.textContent = money(Math.max(0, amt - paid));
    pendDisplay.style.color = (amt - paid) > 0 ? 'var(--danger)' : 'var(--accent)';
  }
  pkgSel.addEventListener('change', recalc);
  startInp.addEventListener('change', recalc);
  amtInp.addEventListener('input', updatePending);
  payInp.addEventListener('input', updatePending);
  recalc();

  $('#renewSubmitBtn').addEventListener('click', async () => {
    const btn = $('#renewSubmitBtn');
    const newPkgId = pkgSel.value;
    const newStart = startInp.value;
    const newEnd = endInp.value;
    const newAmount = parseFloat(amtInp.value) || 0;
    const newPay = parseFloat(payInp.value) || 0;
    const method = $('#renewForm [name=payment_method]').value;

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Processing...';
    try {
      await api.updateMember(member.id, {
        package_id: newPkgId,
        start_date: newStart,
        end_date: newEnd,
        amount: newAmount,
        paid: newPay, // Renewal resets paid for new period
      });
      if (newPay > 0) {
        await sb.from('payments').insert({
          gym_id: state.gym.id,
          member_id: member.id,
          date: todayISO(),
          amount: newPay,
          method,
          package: pkgSel.selectedOptions[0].textContent.split(' — ')[0],
          notes: 'Renewal',
        });
      }
      toast('Membership renewed');
      closeModal();
      if (state.currentPage === 'members') loadMembersTable();
      if (state.currentPage === 'expiry') renderExpiry();
      if (state.currentPage === 'dashboard') renderDashboard();
    } catch (err) {
      console.error(err);
      toast(friendlyError(err), 'error');
      btn.disabled = false;
      btn.textContent = 'Renew Membership';
    }
  });
}

      <button class="btn btn-secondary" onclick="closeModal()">Close</button>
      <button class="btn btn-primary" onclick="window.print()">Print Receipt</button>
    `
  });
}

/* ============================================================
   STARTUP
   ============================================================ */
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_OUT') {
    state.user = null;
    showLogin();
  }
});

checkAuth();
</script>
